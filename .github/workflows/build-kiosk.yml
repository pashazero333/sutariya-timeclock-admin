name: Build TimeClock Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'kiosk/**'
      - 'installer/**'
      - '.github/workflows/build-kiosk.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish kiosk
        shell: pwsh
        run: |
          dotnet publish .\kiosk\SutariyaTimeClockKiosk.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o .\publish `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=false `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\SutariyaTimeClock.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SutariyaTimeClockSetup
          path: installer/Output/SutariyaTimeClockSetup.exe
          if-no-files-found: error
          retention-days: 90
